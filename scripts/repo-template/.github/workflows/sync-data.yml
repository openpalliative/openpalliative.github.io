name: sync-data
on:
  schedule: [{ cron: "43 5 * * 2" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: sync-data, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, actions: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - run: uv run python -m opsite sync-data --from pages
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: sync/data
          delete-branch: true
          title: "data: новые снимки соседей"
          commit-message: "data: новые снимки соседей"
          body: "Соседние репо выпустили новые данные. Проверьте, что сборка зелёная и на страницах нет неожиданных изменений, потом сливайте"
          labels: review:data
          add-paths: |
            vendor/**
            deps.yaml
      - name: checks on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run checks.yml --ref "$BRANCH"
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/sync-data.yml/enable"
