name: watch
on:
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
permissions: {}
concurrency: { group: watch, cancel-in-progress: false }
jobs:
  watch:
    runs-on: ${{ fromJSON(vars.WATCH_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 60
    permissions: { contents: write, pull-requests: write, issues: write, actions: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { version: "0.11.7", enable-cache: false }
      - run: uv sync --frozen
      - name: watch
        run: uv run python -m pipeline.watch --report _reports/watch.json
      - run: uv run python -m opsite build
      - run: uv run python -m opsite check --ci
      - id: facts
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: watch/facts
          delete-branch: true
          title: "data: снимки источников"
          commit-message: "data: снимки источников"
          body: "Служебные снимки наблюдателя: хеши, даты и счётчики источников. Семьи их не видят. После слияния сайт пересоберётся и покажет новую дату проверки"
          labels: facts
          add-paths: data/snapshots/**
      - name: checks on the pull request
        if: steps.facts.outputs.pull-request-operation == 'created' || steps.facts.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.facts.outputs.pull-request-branch }}
        run: gh workflow run checks.yml --ref "$BRANCH"
      - name: review
        if: always() && hashFiles('_reports/watch.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m pipeline.watch --open-issues _reports/watch.json
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: watch-reports, path: _reports, if-no-files-found: ignore }
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/watch.yml/enable"
