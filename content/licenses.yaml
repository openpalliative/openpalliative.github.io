code: Код всех репозиториев распространяется по лицензии MIT
repos:
  - repo: pal-norms
    rows:
      - what: Наборы данных и снимки data/v1
        terms: Creative Commons Attribution 4.0 International (CC BY 4.0)
      - what: Цитаты норм
        terms: Официальные документы не являются объектами авторских прав (п. 6 ст. 1259 ГК РФ)
  - repo: pal-devices-data
    rows:
      - what: Разметка проекта
        terms: передаётся в общественное достояние по CC0 1.0 Universal
      - what: Названия видов медицинских изделий
        terms: открытые данные Росздравнадзора, набор 7710537160-mi_types
      - what: Условия набора названий
        terms: Лицензия набора в его паспорте не указана. При использовании указывайте источник и версию набора
      - what: Тексты законов, приказов и цитаты из них
        terms: Тексты законов, приказов и распоряжений и цитаты из них не охраняются авторским правом (ГК РФ, ст. 1259, п. 6)
  - repo: pal-directory
    rows:
      - what: Номера телефонов, подписи к ним, часы работы и названия ведомств
        terms: "Лицензия таблицы на сайте не указана. Используем на условиях источника: при любом использовании указывайте Росздравнадзор и дату файла"
      - what: Названия и почтовые адреса территориальных органов Росздравнадзора
        lint_allow: [{rule: act-number, reason: "дословно из LICENSE-DATA pal-directory, номер протокола, а не нормы"}]
        terms: Набор распространяется на Типовых условиях использования открытых данных, утверждённых протоколом заочного голосования Правительственной комиссии по координации деятельности открытого правительства от 19 сентября 2016 г. № 6. При использовании указывайте источник и не искажайте данные
      - what: Перечни медицинских организаций и сведения о региональных актах
        terms: Официальные документы государственных органов не являются объектами авторского права (подпункт 1 пункта 6 статьи 1259 Гражданского кодекса РФ)
      - what: Разметка проекта
        terms: передаётся в общественное достояние по CC0 1.0 Universal
  - repo: obrashchenie-kit
    rows:
      - what: Тексты пакета документов, сценариев и подсказок
        terms: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
  - repo: home-care-kit
    rows:
      - what: Тексты листов, поля и дерево вопросов
        terms: Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)
