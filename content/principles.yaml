short:
  - icon: lock
    title: Без сервера
    text: Всё, что вы вводите, хранится только на вашем устройстве. Мы этого не видим
  - icon: book-open
    title: По официальным источникам
    text: Нормы цитируем дословно и пишем, откуда текст и когда сверен. Что ещё не сверено, помечено «Не проверено»
  - icon: code-xml
    title: Бесплатно и открыто
    text: Код и данные под открытыми лицензиями. Любой хоспис или НКО может развернуть инструменты у себя
