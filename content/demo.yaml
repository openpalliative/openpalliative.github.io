swatches:
  - token: bg
    use: фон страницы, бумага
  - token: surface
    use: карточки и поля
  - token: sunken
    use: подложки и таблицы
  - token: text
    use: основной текст
  - token: muted
    use: подписи и подсказки
  - token: border
    use: рамки и поля
  - token: primary
    use: основные кнопки и знак
  - token: link
    use: ссылки, только текстом
  - token: honey
    use: только графика
  - token: highlight
    use: блоки «важно» и «прямо сейчас»
  - token: success
    use: статус «готово»
  - token: warning
    use: статус «срок»
  - token: danger
    use: только ошибки
  - token: focus
    use: кольцо фокуса
