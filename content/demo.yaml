quote:
  text: 'Для доступа абонентов и пользователей услугами фиксированной телефонной связи и услугами подвижной связи к экстренным оперативным службам на всей территории Российской Федерации используется единый номер «112», а также номера соответствующих экстренных служб: «101», «102», «103», «104».'
  source:
    title: Приказ Министерства цифрового развития, связи и массовых коммуникаций Российской Федерации от 31.01.2022 № 75 «Об утверждении российской системы и плана нумерации»
    point: п. 34 российской системы и плана нумерации
    eoNumber: "0001202205300035"
    url: http://publication.pravo.gov.ru/document/0001202205300035
    verified: true
    verified_at: 2026-10-11
  lint_allow:
    - rule: act-number
      reason: заголовок официальной публикации, дословно
